<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de administración · balanc*d</title>
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
    <div class="login-wrap">
        <div class="login-card">
            <h1 class="login-title">balanc*d</h1>
            <p class="login-subtitle">Panel de administración</p>
            <div class="login-error" th:if="${param.error}">Usuario o contraseña incorrectos.</div>
            <div class="login-error" th:if="${param.logout}" style="background:var(--bg-elevated); color:var(--text-secondary);">Sesión cerrada.</div>
            <form th:action="@{/login}" method="post">
                <input type="text" name="username" placeholder="Usuario" autocomplete="username" required autofocus>
                <input type="password" name="password" placeholder="Contraseña" autocomplete="current-password" required>
                <button type="submit">Entrar</button>
            </form>
        </div>
    </div>
</body>
</html>
