# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://192.168.1.7:3306/finanzas?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Europe/Madrid
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=1234
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# La consola H2 está desactivada: la app usa MySQL, y exponer la consola (aunque sea sin
# datos H2 reales detrás) es una superficie de ataque innecesaria en producción (hallazgo C5).
# Para depuración local puntual, sobreescribir con la variable de entorno
# SPRING_H2_CONSOLE_ENABLED=true - nunca activarla en el despliegue público.
spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# JPA/Hibernate Properties
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# SQL initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# Thymeleaf Configuration
spring.thymeleaf.cache=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Configuración de caché para archivos estáticos
spring.web.resources.cache.cachecontrol.max-age=15
spring.web.resources.cache.cachecontrol.must-revalidate=true

spring.devtools.restart.enabled=true
spring.web.resources.static-locations=classpath:/static/,file:./resources/uploads/
spring.web.resources.cache.cachecontrol.no-store=true 
spring.devtools.restart.additional-paths=resources/uploads

# Configuración de Spring Security
spring.security.user.name=admin
spring.security.user.password=admin

# Configuración de cifrado de datos sensibles
# Clave de cifrado AES-256 (32 bytes) - obligatoria, sin valor por defecto
app.encryption.key=${APP_ENCRYPTION_KEY}

# Secreto de firma JWT (HS256, >= 32 bytes) - obligatorio, sin valor por defecto.
# La aplicación falla al arrancar si APP_JWT_SECRET no está definida (ver JwtService).
app.jwt.secret=${APP_JWT_SECRET}

# Configuración de migración de datos
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# Configuración de zona horaria
spring.jackson.time-zone=Europe/Madrid
server.servlet.session.timeout=7d
# Hallazgo M3: cookie de sesión endurecida explícitamente.
# HttpOnly ya lo aplicaba Tomcat por defecto (confirmado en la auditoría). Secure se deja
# condicionado a una variable de entorno porque en local (HTTP) una cookie Secure=true nunca
# se enviaría de vuelta al navegador y rompería el login en desarrollo; en producción
# (balancd.es, servida por HTTPS) debe ir siempre a true - ver la nota de configuración
# COOKIE_SECURE=true en el informe de esta auditoría.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax
# Sin max-age la cookie es "de sesión de navegador": desaparece al cerrar la app del todo (muy
# habitual en la PWA de iPhone, que iOS mata de memoria a menudo), obligando a reiniciar sesión
# aunque no hayan pasado los 7 días de arriba. Con max-age la cookie persiste ese mismo plazo.
server.servlet.session.cookie.max-age=7d

# Configuracion de correo
# Variables locales
resend.api.key=${RESEND_API_KEY}
resend.from.email=${RESEND_FROM_EMAIL}
# Variables completas
