<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Correo enviado • balanc*d</title>
    <th:block th:replace="~{fragments/pwa-meta :: meta}"></th:block>
    <style th:replace="~{fragments/theme-switcher :: theme-styles}"></style>
    <link rel="stylesheet" href="/css/login.css">
    <link rel="stylesheet" href="/css/acceso.css">
    <script th:replace="~{fragments/theme-switcher :: theme-script-immediate}"></script>
</head>
<body>
<a href="/" class="back-home-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"/></svg> Inicio</a>
<div class="check-email-box">
    <img src="/images/logo-app.png" alt="balanc*d">
    <h2>¡Revisa tu correo!</h2>
    <!-- Hallazgo M6: mismo mensaje exista o no la cuenta - de lo contrario esta pantalla
         permitía comprobar qué correos están registrados en balanc*d probando uno a uno. -->
    <p>Si existe una cuenta asociada a <span class="email" th:text="${email}"></span>, te hemos enviado un enlace para restablecer tu contraseña.</p>
    <p>Si no ves el correo, revisa tu carpeta de spam.</p>
</div>
</body>
</html>
