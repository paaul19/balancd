<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Recuperar contraseña • balanc*d</title>
    <th:block th:replace="~{fragments/pwa-meta :: meta}"></th:block>
    <style th:replace="~{fragments/theme-switcher :: theme-styles}"></style>
    <link rel="stylesheet" href="/css/auth.css">
    <script th:replace="~{fragments/theme-switcher :: theme-script-immediate}"></script>
    <script th:replace="~{fragments/theme-switcher :: theme-script}"></script>
    <script src="/js/csrf.js"></script>
</head>
<body class="auth-body">
<a href="/" class="back-home-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"/></svg> Inicio</a>
<main class="auth-main">
    <div class="auth-card">
        <div class="auth-logo">
            <img src="/images/logo-negro.png" alt="balanc*d" class="logo-claro">
            <img src="/images/logo-blanco.png" alt="balanc*d" class="logo-oscuro">
        </div>
        <div class="auth-icon is-info"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3M14 9l2 2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <h1 class="auth-title">¿Olvidaste tu contraseña?</h1>
        <p class="auth-text">Introduce tu correo electrónico y te enviaremos un enlace para restablecerla.</p>
        <form class="auth-form" th:action="@{/forgot-password}" method="post">
            <label class="field">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3.5 7.5l8.5 6 8.5-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <input type="email" name="email" placeholder="Correo electrónico" required autofocus autocomplete="email">
            </label>
            <button type="submit" class="btn-primary">Enviar enlace</button>
        </form>
        <div class="auth-links"><a href="/login" class="auth-link">Volver a iniciar sesión</a></div>
    </div>
</main>
<button type="button" class="theme-switcher" onclick="toggleTheme()" title="Cambiar tema" aria-label="Cambiar tema">
    <span class="sun-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" stroke-linecap="round"/></svg></span>
    <span class="moon-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" stroke-linejoin="round"/></svg></span>
</button>
</body>
</html>
