<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Restablecer contraseña • balanc*d</title>
    <th:block th:replace="~{fragments/pwa-meta :: meta}"></th:block>
    <style th:replace="~{fragments/theme-switcher :: theme-styles}"></style>
    <link rel="stylesheet" href="/css/auth.css">
    <script th:replace="~{fragments/theme-switcher :: theme-script-immediate}"></script>
    <script th:replace="~{fragments/theme-switcher :: theme-script}"></script>
    <script src="/js/csrf.js"></script>
</head>
<body class="auth-body">
<a href="/" class="back-home-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"/></svg> Inicio</a>
<main class="auth-main">
    <div class="auth-card">
        <div class="auth-logo">
            <img src="/images/logo-negro.png" alt="balanc*d" class="logo-claro">
            <img src="/images/logo-blanco.png" alt="balanc*d" class="logo-oscuro">
        </div>
        <div th:if="${valid}" class="auth-icon is-info"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V7a4 4 0 0 1 8 0v4" stroke-linecap="round"/></svg></div>
        <div th:unless="${valid}" class="auth-icon is-danger"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 8v5M12 16.5v.01" stroke-linecap="round"/><circle cx="12" cy="12" r="9"/></svg></div>
        <h1 class="auth-title" th:text="${valid} ? 'Nueva contraseña' : 'Enlace no válido'">Nueva contraseña</h1>
        <div th:if="${valid}" style="width:100%">
            <p class="auth-text">Elige una contraseña nueva para tu cuenta.</p>
            <p th:if="${error}" th:text="${error}" class="error"></p>
            <form class="auth-form" th:action="@{/reset-password}" method="post">
                <input type="hidden" name="token" th:value="${token}">
                <label class="field">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4" stroke-linecap="round"/></svg>
                    <input type="password" name="password" placeholder="Nueva contraseña" minlength="8" required autofocus autocomplete="new-password">
                </label>
                <p class="auth-hint">Mínimo 8 caracteres.</p>
                <button type="submit" class="btn-primary">Guardar nueva contraseña</button>
            </form>
        </div>
        <div th:unless="${valid}" style="width:100%">
            <p class="auth-text">El enlace no es válido o ha expirado.</p>
            <a href="/forgot-password" class="btn-primary">Solicitar nuevo enlace</a>
        </div>
    </div>
</main>
<button type="button" class="theme-switcher" onclick="toggleTheme()" title="Cambiar tema" aria-label="Cambiar tema">
    <span class="sun-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" stroke-linecap="round"/></svg></span>
    <span class="moon-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" stroke-linejoin="round"/></svg></span>
</button>
</body>
</html>
