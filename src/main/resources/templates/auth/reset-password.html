<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Restablecer contraseña • balanc*d</title>
    <th:block th:replace="~{fragments/pwa-meta :: meta}"></th:block>
    <style th:replace="~{fragments/theme-switcher :: theme-styles}"></style>
    <link rel="stylesheet" href="/css/login.css">
    <link rel="stylesheet" href="/css/acceso.css">
    <script th:replace="~{fragments/theme-switcher :: theme-script-immediate}"></script>
    <script src="/js/csrf.js"></script>
</head>
<body>
<a href="/" class="back-home-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"/></svg> Inicio</a>
<div class="check-email-box">
    <img src="/images/logo-app.png" alt="balanc*d">
    <h2>Restablecer contraseña</h2>
    <div th:if="${valid}">
        <p th:if="${error}" th:text="${error}" class="error"></p>
        <form th:action="@{/reset-password}" method="post">
            <input type="hidden" name="token" th:value="${token}" />
            <input type="password" name="password" placeholder="Nueva contraseña (mínimo 8 caracteres)" minlength="8" required autofocus />
            <button type="submit">Guardar nueva contraseña</button>
        </form>
    </div>
    <div th:unless="${valid}" class="error">
        El enlace no es válido o ha expirado.
    </div>
</div>
</body>
</html>
