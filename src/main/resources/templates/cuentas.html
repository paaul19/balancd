<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cuentas</title>
    <th:block th:replace="~{fragments/pwa-meta :: meta}"></th:block>

    <style th:replace="~{fragments/theme-switcher :: theme-styles}"></style>
    <style th:replace="~{fragments/header :: header-styles}"></style>
    <style th:replace="~{fragments/footer :: footer-styles}"></style>
    <link rel="stylesheet" href="/css/cuentas.css">
    <script th:replace="~{fragments/theme-switcher :: theme-script-immediate}"></script>
    <script src="/js/spring.js"></script>
    <script src="/js/footer-modals.js"></script>
</head>
<body style="display:flex; flex-direction:column; min-height:100vh; margin:0; padding:0;">
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="main-content">
        <div class="cuentas-wrap">
            <div class="cuentas-header">
                <h1>Cuentas</h1>
                <button type="button" class="btn-nueva-cuenta" id="btnNuevaCuenta">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>
                    Nueva cuenta
                </button>
            </div>

            <div th:if="${error}" class="cuentas-message error" th:text="${error}"></div>
            <div th:if="${success}" class="cuentas-message success" th:text="${success}"></div>

            <div class="cuentas-total-card">
                <span class="cuentas-total-label">Balance total</span>
                <div class="cuentas-total-amount js-money" th:text="${moneyFormatter.format(balanceTotal)}"></div>
            </div>

            <ul class="cuentas-list" th:if="${!#lists.isEmpty(cuentas)}">
                <li th:each="cuenta : ${cuentas}" class="cuenta-card" th:classappend="${!cuenta.activa} ? 'inactiva'">
                    <span class="cuenta-icon" th:switch="${cuenta.tipo}">
                        <svg th:case="'BANCO'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10l9-6 9 6" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 10v9M9 10v9M15 10v9M19 10v9" stroke-linecap="round"/><path d="M3 19h18" stroke-linecap="round"/></svg>
                        <svg th:case="'EFECTIVO'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/></svg>
                        <svg th:case="'AHORRO'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v5c0 1.7 3.1 3 7 3s7-1.3 7-3V6" stroke-linecap="round"/><path d="M5 11v5c0 1.7 3.1 3 7 3s7-1.3 7-3v-5" stroke-linecap="round"/></svg>
                        <svg th:case="'TARJETA'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/><path d="M6 15h4" stroke-linecap="round"/></svg>
                        <svg th:case="*" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/><path d="M16 12h3" stroke-linecap="round"/><circle cx="16.5" cy="12" r="0.8" fill="currentColor" stroke="none"/></svg>
                    </span>
                    <div class="cuenta-info">
                        <div class="cuenta-nombre">
                            <span th:text="${cuenta.nombre}"></span>
                            <span th:if="${cuenta.ultimosDigitos != null}" class="cuenta-digitos" th:text="'•••• ' + ${cuenta.ultimosDigitos}"></span>
                            <span th:if="${!cuenta.activa}" class="cuenta-badge-inactiva">Inactiva</span>
                        </div>
                        <div class="cuenta-tipo" th:switch="${cuenta.tipo}">
                            <span th:case="'BANCO'">Banco</span>
                            <span th:case="'EFECTIVO'">Efectivo</span>
                            <span th:case="'AHORRO'">Ahorro</span>
                            <span th:case="'TARJETA'">Tarjeta</span>
                            <span th:case="*">Otra</span>
                        </div>
                    </div>
                    <div class="cuenta-saldo-acciones">
                        <span class="cuenta-saldo js-money" th:classappend="${cuenta.saldoActual < 0} ? 'negative'"
                              th:text="${moneyFormatter.format(cuenta.saldoActual)}"></span>
                        <div class="cuenta-actions">
                            <button type="button" class="btn-editar-cuenta"
                                    th:data-id="${cuenta.id}"
                                    th:data-nombre="${cuenta.nombre}"
                                    th:data-tipo="${cuenta.tipo}"
                                    th:data-saldo-inicial="${cuenta.saldoInicial}"
                                    th:data-ultimos-digitos="${cuenta.ultimosDigitos}"
                                    title="Editar">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9" stroke-linecap="round"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z" stroke-linecap="round" stroke-linejoin="round"/></svg>
                            </button>
                            <form th:with="accion=${cuenta.activa} ? 'desactivar' : 'activar'" th:action="@{'/cuentas/' + ${cuenta.id} + '/' + ${accion}}" method="post" style="margin:0;">
                                <button type="submit" th:title="${cuenta.activa} ? 'Desactivar' : 'Reactivar'">
                                    <svg th:if="${cuenta.activa}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M8 12h8" stroke-linecap="round"/></svg>
                                    <svg th:unless="${cuenta.activa}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8" stroke-linecap="round"/></svg>
                                </button>
                            </form>
                            <button type="button" class="btn-eliminar-cuenta"
                                    th:data-id="${cuenta.id}"
                                    th:data-action="@{'/cuentas/' + ${cuenta.id} + '/eliminar'}"
                                    title="Eliminar">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2m-8 0v12a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2V7" stroke-linecap="round" stroke-linejoin="round"/></svg>
                            </button>
                        </div>
                    </div>
                </li>
            </ul>
            <div th:if="${#lists.isEmpty(cuentas)}" class="cuentas-empty">
                Todavía no tienes ninguna cuenta. Crea la primera para empezar a registrar movimientos.
            </div>
        </div>
    </div>

    <!-- Modal crear/editar cuenta -->
    <div id="cuentaModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="cuentaModalTitle">Nueva cuenta</h3>
                <button type="button" class="modal-close" id="closeCuentaModal" aria-label="Cerrar">&times;</button>
            </div>
            <form id="cuentaForm" class="modal-form" th:action="@{/cuentas}" method="post">
                <div class="form-group">
                    <label for="cuentaNombre">Nombre</label>
                    <input type="text" id="cuentaNombre" name="nombre" maxlength="100" required placeholder="Ej. Santander, Efectivo...">
                </div>
                <div class="form-group">
                    <label for="cuentaTipo">Tipo</label>
                    <select id="cuentaTipo" name="tipo" required>
                        <option value="BANCO">Banco</option>
                        <option value="EFECTIVO">Efectivo</option>
                        <option value="AHORRO">Ahorro</option>
                        <option value="TARJETA">Tarjeta</option>
                        <option value="OTRA">Otra</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="cuentaSaldoInicial">Saldo inicial (<span th:text="${moneyFormatter.simbolo}">€</span>)</label>
                    <input type="number" id="cuentaSaldoInicial" name="saldoInicial" step="0.01" value="0">
                </div>
                <div class="form-group">
                    <label for="cuentaUltimosDigitos">Últimos 4 dígitos (opcional)</label>
                    <input type="text" id="cuentaUltimosDigitos" name="ultimosDigitos" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" placeholder="Ej. 1234">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" id="btnCancelarCuenta">Cancelar</button>
                    <button type="submit" class="btn-save">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal confirmación de eliminación -->
    <div id="modalConfirmarEliminarCuenta" class="modal">
        <div class="modal-content" style="max-width:340px;">
            <p style="margin:0 0 1.2rem;">¿Seguro que quieres eliminar esta cuenta? Solo es posible si no tiene movimientos ni transferencias asociadas.</p>
            <div class="modal-actions">
                <button type="button" class="btn-cancel" id="cancelarEliminarCuenta">Cancelar</button>
                <button type="button" class="btn-danger" id="confirmarEliminarCuenta">Eliminar</button>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script th:replace="~{fragments/header :: header-script}"></script>
    <script th:replace="~{fragments/theme-switcher :: theme-script}"></script>
    <script src="/js/cuentas.js"></script>
</body>
</html>
