<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <!-- Iconos de categoría: trazo currentColor para heredar el color del contenedor.
         La clave es el campo "icono" de la entidad Categoria (ver CategoriaSeedService). -->
    <th:block th:fragment="icon(icono)" th:switch="${icono}">
        <svg th:case="'alimentacion'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2v7a1 1 0 0 0 2 0V2M4 2v7a1 1 0 0 0 2 0V2M4 9v13M18 2c-1.7 0-3 2-3 4.5S16.3 11 18 11v11" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <svg th:case="'vivienda'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11.5L12 4l9 7.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.5 10v8a1.5 1.5 0 0 0 1.5 1.5h10a1.5 1.5 0 0 0 1.5-1.5v-8" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.5 19.5V14a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v5.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <svg th:case="'transporte'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 11l1.3-3.9A2 2 0 0 1 8.2 5.7h7.6a2 2 0 0 1 1.9 1.4L19 11" stroke-linecap="round" stroke-linejoin="round"/><rect x="3" y="11" width="18" height="6" rx="2"/><circle cx="7.5" cy="17.5" r="1.4"/><circle cx="16.5" cy="17.5" r="1.4"/></svg>
        <svg th:case="'ocio'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v2.2a1.8 1.8 0 0 0 0 3.6V16a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2.2a1.8 1.8 0 0 0 0-3.6V8z"/><path d="M9 6.2v11.6" stroke-dasharray="2.2 2.2"/></svg>
        <svg th:case="'compras'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6.5 8h11l-.9 11.1a2 2 0 0 1-2 1.9H9.4a2 2 0 0 1-2-1.9L6.5 8z" stroke-linejoin="round"/><path d="M9 8V6a3 3 0 0 1 6 0v2" stroke-linecap="round"/></svg>
        <svg th:case="'salud'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2.5a3 3 0 0 0-3 3v3.5H5.5a3 3 0 0 0 0 6H9V18.5a3 3 0 0 0 6 0V15h3.5a3 3 0 0 0 0-6H15V5.5a3 3 0 0 0-3-3z" stroke-linejoin="round"/></svg>
        <svg th:case="'educacion'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 9.5L12 4.8 2 9.5l10 4.7 10-4.7z" stroke-linejoin="round"/><path d="M6 11.7v4.6c0 1.4 2.7 3.2 6 3.2s6-1.8 6-3.2v-4.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M22 9.5v5.7" stroke-linecap="round"/></svg>
        <svg th:case="'viajes'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12l19-9-9 19-2-8-8-2z" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <svg th:case="'mascotas'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="7" cy="9" r="1.8"/><circle cx="12" cy="6.5" r="1.8"/><circle cx="17" cy="9" r="1.8"/><path d="M12 12.5c-3 0-6 2-6 5a2.5 2.5 0 0 0 4 2c1-.8 1.3-1 2-1s1 .2 2 1a2.5 2.5 0 0 0 4-2c0-3-3-5-6-5z"/></svg>
        <svg th:case="'seguros'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z" stroke-linejoin="round"/></svg>
        <svg th:case="'impuestos'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10l9-6 9 6" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 10v9M9 10v9M15 10v9M19 10v9" stroke-linecap="round"/><path d="M3 19h18" stroke-linecap="round"/></svg>
        <svg th:case="'regalos'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="8" width="18" height="4" rx="1"/><rect x="5" y="12" width="14" height="9"/><path d="M12 8v13M12 8c-1.5-3-5-3-5-1s2 1 5 1zM12 8c1.5-3 5-3 5-1s-2 1-5 1z" stroke-linejoin="round"/></svg>
        <svg th:case="'suscripciones'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 2.5l3.5 3.5L17 9.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M3.5 12V10a4 4 0 0 1 4-4h13" stroke-linecap="round" stroke-linejoin="round"/><path d="M7 21.5L3.5 18 7 14.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.5 12v2a4 4 0 0 1-4 4h-13" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <svg th:case="'finanzas'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/><path d="M6 15h4" stroke-linecap="round"/></svg>
        <svg th:case="'ingresos'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v5c0 1.7 3.1 3 7 3s7-1.3 7-3V6" stroke-linecap="round"/><path d="M5 11v5c0 1.7 3.1 3 7 3s7-1.3 7-3v-5" stroke-linecap="round"/></svg>
        <svg th:case="*" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.6 12.9L12.9 20.6a2 2 0 0 1-2.8 0l-6.7-6.7a2 2 0 0 1 0-2.8L11.1 3.4A2 2 0 0 1 12.5 2.8L19 3a2 2 0 0 1 2 2l.2 6.5a2 2 0 0 1-.6 1.4z" stroke-linejoin="round"/><circle cx="15" cy="8" r="1.4" fill="currentColor" stroke="none"/></svg>
    </th:block>
</body>
</html>
