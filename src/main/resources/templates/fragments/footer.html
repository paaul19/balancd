<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <style th:fragment="footer-styles">
        :root {
            --footer-bg: color-mix(in srgb, var(--bg-elevated) 78%, transparent);
            --footer-icon: var(--text-tertiary);
            --footer-icon-active: var(--text-primary);
            --footer-border: var(--border-color);
        }
        .footer-bar {
            position: fixed;
            left: 50%;
            bottom: calc(14px + env(safe-area-inset-bottom, 0px));
            transform: translateX(-50%);
            width: calc(100vw - 32px);
            max-width: 420px;
            background: var(--footer-bg);
            backdrop-filter: blur(var(--blur-regular, 20px)) saturate(180%);
            -webkit-backdrop-filter: blur(var(--blur-regular, 20px)) saturate(180%);
            display: flex;
            flex-direction: row;
            justify-content: space-around;
            align-items: center;
            height: 64px;
            border: 1px solid var(--footer-border);
            border-top-color: color-mix(in srgb, var(--footer-border) 60%, white 20%);
            border-radius: 24px;
            z-index: 1000;
            box-shadow: var(--shadow-lg);
            flex-wrap: nowrap;
            padding: 0 4px;
            transition: transform var(--dur-fast, 180ms) var(--ease-standard, ease);
        }
        .footer-btn {
            background: none;
            outline: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--footer-icon);
            font-size: 13px;
            cursor: pointer;
            transition: color var(--dur-fast, 180ms) var(--ease-standard), background var(--dur-fast, 180ms) var(--ease-standard);
            padding: 0 2px;
            border-radius: 14px;
            width: 44px;
            height: 44px;
            border: none;
            min-width: 0;
            min-height: 0;
            text-decoration: none;
        }
        .footer-btn svg {
            margin-bottom: 1px;
            width: 22px;
            height: 22px;
            display: block;
        }
        .footer-btn.center {
            background: var(--accent);
            width: 46px;
            height: 46px;
            margin-top: 0;
            box-shadow: 0 6px 18px var(--accent-soft);
            color: #06120a;
            border: none;
            transition: transform var(--dur-instant, 100ms) var(--ease-standard), box-shadow var(--dur-fast, 180ms) var(--ease-standard);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }
        .footer-btn.center svg circle,
        .footer-btn.center svg line {
            stroke: currentColor !important;
        }
        .footer-btn.center:hover {
            transform: scale(1.06);
        }
        .footer-btn.active, .footer-btn:hover {
            color: var(--footer-icon-active);
            background: var(--border-color);
        }
        @media (max-width: 600px) {
            .footer-bar {
                height: 62px;
                width: calc(100vw - 24px);
            }
            .footer-btn, .footer-btn.center {
                width: 46px;
                height: 46px;
            }
            .footer-btn.center {
                padding: 4px !important;
                box-sizing: border-box;
            }
            .footer-btn svg {
                width: 22px;
                height: 22px;
            }
            .footer-btn.center svg {
                width: 22px;
                height: 22px;
            }
        }
    </style>
</head>
<body>
    <footer class="footer-bar" th:fragment="footer">
        <!-- Página principal -->
        <a href="/movimientos" class="footer-btn" title="Inicio" data-intro="Consulta tus movimientos de cada mes." data-step="1" data-position="top">
            <svg fill="none" stroke="currentColor" stroke-width="2.1" viewBox="0 0 24 24"><path d="M3 12l9-8 9 8" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 10v8a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2v-4h2v4a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2v-8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
        <!-- Búsqueda avanzada -->
        <a href="/movimientos/busqueda-avanzada" class="footer-btn" title="Búsqueda avanzada" data-intro="Filtra movimientos por asunto y periodo de tiempo." data-step="2" data-position="top">
            <svg fill="none" stroke="currentColor" stroke-width="2.1" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65" stroke-linecap="round"/></svg>
        </a>
        <!-- Botón central (+) -->
        <button class="footer-btn center" title="Añadir" data-intro="Añade un ingreso o gasto nuevo." data-step="3" data-position="top">
            <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" stroke="var(--accent)" stroke-width="2.5"/><line x1="12" y1="8" x2="12" y2="16" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round"/><line x1="8" y1="12" x2="16" y2="12" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round"/></svg>
        </button>
        <!-- Movimientos recurrentes -->
        <a href="/movimientos/recurrentes" class="footer-btn" title="Recurrentes" data-intro="Gestiona tus movimientos recurrentes." data-step="4" data-position="top">
            <svg fill="none" stroke="currentColor" stroke-width="2.1" viewBox="0 0 295.914 295.914">
                <g>
                    <path d="M67.964,120.522H53.356c11.922-42,50.267-72.631,95.604-72.631c22.904,0,44.424,7.687,62.234,21.997
                c9.912,7.966,18.172,17.564,24.362,28.634h35.811c-8.395-21.286-22.133-39.853-39.871-54.107
                c-23.292-18.717-52.604-28.751-82.537-28.751c-63.354,0-116.41,44.858-129.009,104.858H0l33.491,55.506L67.964,120.522z"
                          fill="currentColor"/>
                    <path d="M262.423,120.015l-34.473,55.508h14.607c-11.922,42-50.267,72.135-95.604,72.135c-22.904,0-44.424-7.202-62.234-21.513
                c-10.011-8.043-18.324-17.622-24.537-28.622H24.394c8.389,21,22.189,39.517,40.023,53.848
                c23.292,18.717,52.603,28.88,82.537,28.88c63.354,0,116.41-44.727,129.009-104.727h19.951L262.423,120.015z"
                          fill="currentColor"/>
                </g>
            </svg>
        </a>



        <!-- Objetivos y presupuestos -->
        <a href="/objetivos" class="footer-btn" title="Objetivos y presupuestos" data-intro="Consulta tus objetivos y presupuestos." data-step="5" data-position="top">
            <svg fill="none" stroke="currentColor" stroke-width="2.1" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/></svg>
        </a>
        <!--
            Solo rellena window.cuentasUsuario si la propia página no lo hizo ya (lista.html y
            recurrentes.html siguen fijando su propia versión más adelante en el documento, que
            sobreescribe esta). En el resto de páginas (ajustes, categorías, perfil, búsqueda...)
            no existía ninguna, así que el botón "+" del footer creía que no tenías cuentas.
        -->
        <script th:inline="javascript">
            if (typeof window.cuentasUsuario === 'undefined') {
                window.cuentasUsuario = /*[[${cuentasActivasGlobal}]]*/ [];
            }
        </script>
    </footer>
</body>
</html>
