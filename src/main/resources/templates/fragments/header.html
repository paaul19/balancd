<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style th:fragment="header-styles">
        body {
            margin: 0;
            padding: 0;
        }
        .header {
            background: color-mix(in srgb, var(--bg-primary) 74%, transparent);
            backdrop-filter: blur(var(--blur-regular, 20px)) saturate(180%);
            -webkit-backdrop-filter: blur(var(--blur-regular, 20px)) saturate(180%);
            border-bottom: none;
            width: 100vw;
            min-height: 60px;
            height: 60px;
            margin: 0;
            padding: 0;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            box-shadow: none;
        }
        /* Scroll-edge fade en vez de un borde duro: el contenido se desvanece al pasar bajo el header */
        .header::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            top: 100%;
            height: 14px;
            pointer-events: none;
            background: linear-gradient(to bottom, color-mix(in srgb, var(--bg-primary) 40%, transparent), transparent);
        }
        .header-inner {
            position: relative;
            width: 100vw;
            height: 100%;
        }
        .header-logo {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .header-logo img {
            height: 40px;
            width: auto;
            transition: all 0.3s ease;
            display: block;
        }
        .header-logo img:hover {
            transform: scale(1.05);
        }
        .header-actions {
            position: absolute;
            right: 2rem;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .header-theme-toggle {
            position: absolute;
            left: 2rem;
            top: 50%;
            transform: translateY(-50%);
            z-index: 2;
        }
        .logout-btn {
            background: var(--bg-elevated);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            padding: 0;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logout-btn svg {
            width: 18px;
            height: 18px;
        }
        .logout-btn span:not(.icon-logout) {
            display: none;
        }
        .logout-btn:hover {
            background: var(--border-color);
            transform: scale(1.05);
        }
        @media (max-width: 768px) {
            .header {
                min-height: 54px;
                height: 54px;
            }
            .header-logo img {
                height: 32px;
            }
            .header-actions {
                right: 1rem;
            }
            .header-theme-toggle {
                left: 1rem;
            }
            .logout-btn {
                padding: 0.5rem 1rem;
                font-size: 0.8rem;
            }
        }
        @media (max-width: 480px) {
            .header {
                min-height: 44px;
                height: 44px;
            }
            .header-logo img {
                height: 26px;
            }
            .header-actions {
                right: 0.5rem;
            }
            .header-theme-toggle {
                left: 0.5rem;
            }
            .logout-btn {
                padding: 0.4rem 0.8rem;
                font-size: 0.75rem;
            }
        }
        .header {
            padding-top: env(safe-area-inset-top, 0px);
        }
        .header::before {
            content: '';
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: env(safe-area-inset-top, 0px);
            background: var(--bg-secondary) !important;
            z-index: 2000;
        }
        .ios-notch-fix {
            display: none;
        }
        @supports(padding-top: env(safe-area-inset-top)) {
            .ios-notch-fix {
                display: block;
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: env(safe-area-inset-top, 0px);
                background: var(--bg-secondary);
                z-index: 2001;
            }
        }
        /* Asegurar que el contenido principal no se superponga con el notch */
        body {
            padding-top: env(safe-area-inset-top, 0px);
        }
        .main-content {
            padding-top: calc(64px + env(safe-area-inset-top, 0px));
        }
        @media (max-width: 768px) {
            .main-content {
                padding-top: calc(54px + env(safe-area-inset-top, 0px));
            }
        }
        @media (max-width: 480px) {
            .main-content {
                padding-top: calc(44px + env(safe-area-inset-top, 0px));
            }
        }
    </style>
</head>
<body>
    <div class="ios-notch-fix"></div>
    <header class="header" th:fragment="header">
        <div class="header-inner">
            <div class="header-theme-toggle">
                <button class="theme-switcher" onclick="toggleTheme()" title="Cambiar tema">
                    <span class="sun-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" stroke-linecap="round"/></svg></span>
                    <span class="moon-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" stroke-linejoin="round"/></svg></span>
                </button>
            </div>
            <div class="header-logo">
                <img src="/images/logo-negro.png" alt="Logo" class="logo-negro">
                <img src="/images/logo-blanco.png" alt="Logo" class="logo-blanco" style="display: none;">
            </div>
            <div class="header-actions">
                <a href="/logout" class="logout-btn" title="Cerrar sesión">
                    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 17l5-5-5-5M21 12H9" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </a>
            </div>
        </div>
        <script th:fragment="header-script">
            function updateLogo() {
                const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
                const logoNegro = document.querySelector('.logo-negro');
                const logoBlanco = document.querySelector('.logo-blanco');
                if (isDark) {
                    logoNegro.style.display = 'none';
                    logoBlanco.style.display = 'block';
                } else {
                    logoNegro.style.display = 'block';
                    logoBlanco.style.display = 'none';
                }
            }
            document.addEventListener('DOMContentLoaded', function() {
                updateLogo();
                const observer = new MutationObserver(function(mutations) {
                    mutations.forEach(function(mutation) {
                        if (mutation.type === 'attributes' && mutation.attributeName === 'data-theme') {
                            updateLogo();
                        }
                    });
                });
                observer.observe(document.documentElement, {
                    attributes: true,
                    attributeFilter: ['data-theme']
                });
            });
        </script>
    </header>
</body>
</html>
