<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:fragment="meta">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
        <!-- Antes usaban una sola imagen (con fondo transparente, invisible sobre fondos claros)
             para favicon, apple-touch-icon y el icono grande del manifest a la vez. Ahora hay un
             set generado a partir del mismo icono con fondo sólido, en los tamaños exactos que
             pide cada contexto (pestaña del navegador, icono de pantalla de inicio en iOS/Android,
             icono adaptable "maskable" de Android). -->
        <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16.png">
        <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
        <link rel="manifest" href="/manifest.json">
        <meta name="theme-color" content="#0c0c0e">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <meta name="apple-mobile-web-app-title" content="balanc*d">
        <!-- Bloqueo con passkey al volver a la app; AppLockFilter solo marca appLockActivo
             para usuarios con passkey y la sesión ya desbloqueada. -->
        <script th:if="${appLockActivo}" src="/js/app-lock.js"
                th:attr="data-idle-minutes=${appLockIdleMinutes},data-recien-desbloqueado=${appLockRecienDesbloqueado == true}"></script>
    </th:block>
</head>
<body></body>
</html>
