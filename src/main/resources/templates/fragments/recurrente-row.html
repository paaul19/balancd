<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
        <!-- Fila de un recurrente: pulsar la fila abre la edición (botón .btn-modificar superpuesto);
             el borrado es el botón de papelera. Mismos data-* y clases que usa recurrentes.js. -->
        <li class="group-row recurrente-row" th:fragment="recRow(rec)">
            <span class="rec-icon" aria-hidden="true">
                <svg th:if="${rec.activo}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <svg th:unless="${rec.activo}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>
            </span>
            <span class="rec-body">
                <span class="rec-asunto" th:text="${rec.asunto}">Asunto</span>
                <span class="rec-sub">
                    <span th:switch="${rec.frecuencia}">
                        <span th:case="'semana'">Cada semana</span>
                        <span th:case="'dos_semanas'">Cada 2 semanas</span>
                        <span th:case="'mes'">Cada mes</span>
                        <span th:case="'dos_meses'">Cada 2 meses</span>
                        <span th:case="'anio'">Cada año</span>
                        <span th:case="*" th:text="${rec.frecuencia}"></span>
                    </span><th:block th:if="${rec.cuentaNombre != null}"> · <span th:text="${rec.cuentaNombre}"></span></th:block>
                    · desde <span th:text="${#temporals.format(rec.fechaInicio, 'dd/MM/yyyy')}"></span><th:block th:if="${rec.fechaFin != null}"> · hasta <span th:text="${#temporals.format(rec.fechaFin, 'dd/MM/yyyy')}"></span></th:block>
                </span>
            </span>
            <span class="rec-cantidad" th:classappend="${rec.ingreso ? 'cantidad-ingreso' : 'cantidad-gasto'}">
                <span th:text="${rec.ingreso ? '+' : '-'}"></span><span class="js-money" th:text="${moneyFormatter.format(rec.cantidad)}"></span>
            </span>
            <button type="button"
                    class="btn-modificar rec-tap"
                    aria-label="Modificar"
                    th:attr="aria-label='Modificar ' + ${rec.asunto}"
                    th:data-id="${rec.id}"
                    th:data-asunto="${rec.asunto}"
                    th:data-cantidad="${rec.cantidad}"
                    th:data-ingreso="${rec.ingreso}"
                    th:data-fecha="${#temporals.format(rec.fechaInicio, 'yyyy-MM-dd')}"
                    th:data-frecuencia="${rec.frecuencia}"
                    th:data-categoria-id="${rec.categoriaId}"
                    th:data-subcategoria-id="${rec.subcategoriaId}"
                    th:data-cuenta-id="${rec.cuentaId}"></button>
            <form th:if="${rec.activo}" th:action="@{'/movimientos/recurrentes/terminar/' + ${rec.id}}" method="post" class="rec-delete-form rec-end-form">
                <button type="submit" class="rec-delete rec-end" aria-label="Terminar" title="Terminar recurrente">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><rect x="9" y="9" width="6" height="6" rx="1" fill="currentColor" stroke="none"/></svg>
                </button>
            </form>
            <form th:action="@{'/movimientos/recurrentes/borrar/' + ${rec.id}}" method="post" class="rec-delete-form">
                <button type="submit" class="btn-danger rec-delete" aria-label="Borrar" title="Borrar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
            </form>
        </li>
</body>
</html>
