<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <style th:fragment="theme-styles">
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        /* Variables CSS para temas */
        :root {
            /* Tema claro (por defecto): porcelana cálida, casi-monocromo con color con propósito */
            --bg-primary: #f5f3ef;
            --bg-secondary: #ffffff;
            --bg-elevated: #ffffff;
            --text-primary: #17161a;
            --text-secondary: #6f6d76;
            --text-tertiary: #a4a1aa;
            --border-color: #e8e5df;
            --shadow-sm: 0 2px 10px rgba(23,22,26,0.05);
            --shadow: 0 10px 34px rgba(23,22,26,0.07);
            --shadow-lg: 0 28px 70px rgba(23,22,26,0.14);
            --button-bg: #17161a;
            --button-hover: #322f38;
            --button-text: #ffffff;
            --input-border: #e0ddd6;
            --link-color: #17161a;
            --accent: #1a9c63;
            --accent-soft: rgba(26,156,99,0.12);
            --danger: #d94c42;
            --danger-soft: rgba(217,76,66,0.12);
            --info: #6d5ef0;
            --info-soft: rgba(109,94,240,0.12);
            --radius-lg: 22px;
            --radius-md: 16px;
            --radius-sm: 10px;

            /* Materiales: peso de blur/saturación según tamaño de superficie */
            --blur-thin: 12px;
            --blur-regular: 20px;
            --blur-thick: 34px;

            /* Motion: curvas que aproximan springs (critically damped por defecto, sin overshoot) */
            --ease-standard: cubic-bezier(0.22, 1, 0.36, 1);
            --ease-standard-in: cubic-bezier(0.64, 0, 0.78, 0);
            --ease-momentum: cubic-bezier(0.34, 1.56, 0.64, 1);
            --dur-instant: 100ms;
            --dur-fast: 180ms;
            --dur-base: 320ms;
            --dur-slow: 420ms;

            /* Tipografía: tracking/leading específicos por tamaño (óptico) */
            --tracking-display: -0.03em;
            --tracking-title: -0.015em;
            --tracking-body: -0.005em;
            --tracking-caption: 0.01em;

            --focus-ring: 0 0 0 3px var(--accent-soft), 0 0 0 1.5px var(--accent);
        }

        /* Tema oscuro: grafito cálido, no negro puro */
        [data-theme="dark"] {
            --bg-primary: #0c0c0e;
            --bg-secondary: #17171b;
            --bg-elevated: #1e1e24;
            --text-primary: #f5f4f2;
            --text-secondary: #a09eaa;
            --text-tertiary: #6f6d78;
            --border-color: #27272e;
            --shadow-sm: 0 2px 10px rgba(0,0,0,0.3);
            --shadow: 0 14px 44px rgba(0,0,0,0.45);
            --shadow-lg: 0 32px 80px rgba(0,0,0,0.6);
            --button-bg: #f5f4f2;
            --button-hover: #dad8d4;
            --button-text: #0c0c0e;
            --input-border: #2c2c33;
            --link-color: #f5f4f2;
            --accent: #32d399;
            --accent-soft: rgba(50,211,153,0.16);
            --danger: #ff6f66;
            --danger-soft: rgba(255,111,102,0.16);
            --info: #9b8cff;
            --info-soft: rgba(155,140,255,0.18);
        }

        /* iOS 26/27 PWA: con la barra de estado "default" WebKit rellena la zona de arriba con un
           blur de Liquid Glass salvo que pueda muestrear un color sólido en el borde superior de
           la página. Esta franja fija de 1px con el fondo del tema se lo da (y sigue claro/oscuro). */
        @supports (-webkit-touch-callout: none) {
            html::before {
                content: '';
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                height: 1px;
                z-index: 0;
                pointer-events: none;
                background-color: var(--bg-primary);
            }
        }

        /* Modales cerrados: ocultos desde el primer pintado. Su CSS completo lo inyecta
           footer-modals.js al terminar de cargar, y hasta entonces se veían un instante
           (en recurrentes, perfil y ajustes) antes de desaparecer. */
        .modal:not(.show) {
            position: fixed;
            inset: 0;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* ============================================================
           Diálogos de confirmación compartidos (icono, título, texto, 2 botones).
           Se usan dentro de .modal > .modal-content.confirm-content, o sueltos
           como .confirm-dialog (p. ej. dentro de un overlay propio).
           ============================================================ */
        .confirm-content, .confirm-dialog {
            width: calc(100% - 2.5rem);
            max-width: 340px;
            padding: 1.6rem 1.4rem 1.3rem;
            text-align: center;
            background: var(--bg-secondary);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
        }
        .confirm-dialog {
            margin: auto;
            border: 1px solid var(--border-color);
            animation: confirm-pop 260ms var(--ease-standard) backwards;
        }
        @keyframes confirm-pop {
            from { opacity: 0; transform: scale(0.95) translateY(8px); }
        }
        @media (prefers-reduced-motion: reduce) {
            .confirm-dialog { animation: fade-in-only 160ms ease backwards; }
        }
        .confirm-icon {
            width: 52px;
            height: 52px;
            margin: 0 auto 0.9rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .confirm-icon svg { width: 26px; height: 26px; }
        .confirm-icon.is-accent { background: var(--accent-soft); color: var(--accent); }
        .confirm-icon.is-danger { background: var(--danger-soft); color: var(--danger); }
        .confirm-title {
            margin: 0 0 0.45rem;
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: var(--tracking-title);
        }
        .confirm-text {
            margin: 0 0 1.3rem;
            font-size: 0.92rem;
            line-height: 1.5;
            color: var(--text-secondary);
        }
        .confirm-text b { color: var(--text-primary); }
        .confirm-actions { display: flex; gap: 0.7rem; }
        .confirm-btn {
            flex: 1 1 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.8rem 1rem !important;
            border: none;
            border-radius: var(--radius-md);
            font-family: inherit;
            font-size: 0.95rem !important;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
        }
        .confirm-cancel { background: var(--bg-elevated); color: var(--text-primary); border: 1px solid var(--border-color); }
        .confirm-cancel:hover { background: var(--border-color); }
        .confirm-ok { background: var(--accent); color: #06120a; box-shadow: 0 8px 24px var(--accent-soft); }
        .confirm-ok:hover { background: var(--accent); filter: brightness(1.06); }
        .confirm-danger { background: var(--danger); color: #fff; }
        .confirm-danger:hover { background: var(--danger); filter: brightness(0.92); }

        /* ============================================================
           Capa de movimiento compartida (ver /js/motion.js)
           Curva: --ease-standard (ease-out fuerte). Solo transform/opacity.
           ============================================================ */

        /* Navegación entre páginas (View Transitions entre documentos: Chrome 126+, Safari 18.2+).
           Header y footer tienen nombre propio para quedarse quietos mientras cambia el contenido. */
        /* No en iOS: durante la transición WebKit enseña capturas en vez de la página real y la
           franja de 1px que le sirve para colorear la barra de estado (ver html::before) deja de
           muestrearse, con lo que el blur de iOS 27 reaparece arriba hasta que termina. */
        @media (prefers-reduced-motion: no-preference) {
            @supports not (-webkit-touch-callout: none) {
                @view-transition { navigation: auto; }
            }
        }
        .header { view-transition-name: app-header; }
        .footer-bar { view-transition-name: app-footer; }
        ::view-transition-group(root),
        ::view-transition-group(app-header),
        ::view-transition-group(app-footer) {
            animation-duration: 200ms;
            animation-timing-function: var(--ease-standard);
        }
        ::view-transition-old(root),
        ::view-transition-new(root),
        ::view-transition-old(app-header),
        ::view-transition-new(app-header),
        ::view-transition-old(app-footer),
        ::view-transition-new(app-footer) {
            animation-duration: 180ms;
            animation-timing-function: var(--ease-standard);
        }

        /* Entrada escalonada del contenido de cada página */
        @keyframes rise-in {
            from { opacity: 0; transform: translateY(10px); }
        }
        @keyframes fade-in-only {
            from { opacity: 0; }
        }
        /* Solo CSS (sin esperar a JS) para que arranque invisible desde el primer pintado: si lo
           añadía un script al cargar el DOM, el contenido se veía entero, desaparecía y recién
           entonces hacía el fundido. Los hijos del contenedor principal entran escalonados. */
        .main-content > :is([class$="-wrap"], .container) > :not(script, style, template, .modal, [hidden]) {
            animation: rise-in 280ms var(--ease-standard) backwards;
        }
        .main-content > :is([class$="-wrap"], .container) > :nth-child(2) { animation-delay: 40ms; }
        .main-content > :is([class$="-wrap"], .container) > :nth-child(3) { animation-delay: 80ms; }
        .main-content > :is([class$="-wrap"], .container) > :nth-child(4) { animation-delay: 120ms; }
        .main-content > :is([class$="-wrap"], .container) > :nth-child(5) { animation-delay: 160ms; }
        .main-content > :is([class$="-wrap"], .container) > :nth-child(6) { animation-delay: 200ms; }
        .main-content > :is([class$="-wrap"], .container) > :nth-child(n+7) { animation-delay: 240ms; }
        @media (prefers-reduced-motion: reduce) {
            .main-content > :is([class$="-wrap"], .container) > :not(script, style, template, .modal, [hidden]) {
                animation: fade-in-only 160ms ease backwards;
                animation-delay: 0ms;
            }
        }

        /* Mensajes de error/éxito: aparecen en vez de saltar */
        @keyframes msg-in {
            from { opacity: 0; transform: translateY(-6px); }
        }
        .error, .success,
        [class$="-message"], [class*="-message "] {
            animation: msg-in 220ms var(--ease-standard) backwards;
        }
        @media (prefers-reduced-motion: reduce) {
            .error, .success, [class$="-message"], [class*="-message "] { animation: fade-in-only 160ms ease backwards; }
        }

        /* Header: separación sutil al hacer scroll */
        .header { transition: box-shadow var(--dur-base) var(--ease-standard); }
        .header.is-scrolled {
            box-shadow: 0 1px 0 var(--border-color), 0 10px 28px rgba(0, 0, 0, 0.10);
        }

        /* Filas/tarjetas pulsables: respuesta inmediata al tocar, vuelta suave al soltar */
        .group-row, .recurrente-row, .balance-card {
            transition: transform var(--dur-base) var(--ease-standard), background-color var(--dur-fast) var(--ease-standard);
        }
        a.group-row:active,
        .recurrente-row:has(.rec-tap:active) {
            transform: scale(0.985);
            transition-duration: var(--dur-instant);
        }

        /* Botón enviando: spinner en lugar del texto (lo marca motion.js al hacer submit) */
        @keyframes spin { to { transform: rotate(360deg); } }
        .is-busy {
            position: relative;
            pointer-events: none;
            color: transparent !important;
        }
        .is-busy > * { opacity: 0; }
        .is-busy::after {
            content: "";
            position: absolute;
            inset: 0;
            margin: auto;
            width: 1.15em;
            height: 1.15em;
            border-radius: 50%;
            border: 2px solid color-mix(in srgb, var(--busy-color, currentColor) 28%, transparent);
            border-top-color: var(--busy-color, currentColor);
            animation: spin 700ms linear infinite;
        }

        /* Aplicar variables CSS */
        * {
            box-sizing: border-box;
        }

        html {
            background: var(--bg-primary);
        }
        body {
            background: transparent;
        }

        /* Fondo ambiental compartido por toda la app (mismo look que las páginas de acceso):
           halos suaves con el acento y el tono info, fijos tras el contenido. Solo en la parte
           inferior: arriba chocaban con el header sólido y dejaban un corte visible. */
        html::after {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background:
                radial-gradient(55% 40% at 105% 108%, var(--info-soft), transparent 70%),
                radial-gradient(55% 40% at -10% 108%, var(--accent-soft), transparent 70%);
            opacity: 0.9;
        }

        /* Foco con el mismo anillo verde que en los formularios de acceso */
        input:focus, select:focus, textarea:focus {
            border-color: var(--accent);
            box-shadow: var(--focus-ring);
        }

        /* Botón principal de acción: acento verde con halo, como el CTA de la landing */
        .btn-primary-accent,
        .btn-nueva-cuenta, .btn-nuevo, .btn-save,
        .filtros-row-boton button {
            background: var(--accent);
            color: #06120a;
            box-shadow: 0 8px 24px var(--accent-soft);
        }
        .btn-primary-accent:hover,
        .btn-nueva-cuenta:hover, .btn-nuevo:hover, .btn-save:hover,
        .filtros-row-boton button:hover {
            background: var(--accent);
            filter: brightness(1.06);
        }

        /* Reserva siempre el espacio de la scrollbar: sin esto, las páginas con
           poco contenido (búsqueda, recurrentes) no la muestran y el footer fijo
           (centrado con left:50%) queda unos píxeles desplazado respecto a las
           páginas con scroll (dashboard, perfil), dando sensación de que "se mueve". */
        html {
            scrollbar-gutter: stable;
            overflow-y: scroll;
        }

        body {
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            letter-spacing: var(--tracking-body);
            transition: background-color var(--dur-base) var(--ease-standard), color var(--dur-base) var(--ease-standard);
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            background: var(--bg-secondary);
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
        }

        h1, h2, h3, h4, h5, h6 {
            color: var(--text-primary);
            letter-spacing: var(--tracking-title);
            line-height: 1.15;
        }

        button {
            background: var(--button-bg);
            color: var(--button-text);
            border: 1px solid var(--border-color);
            font-family: inherit;
            transition: background-color var(--dur-fast) var(--ease-standard), transform var(--dur-instant) var(--ease-standard), box-shadow var(--dur-fast) var(--ease-standard);
        }

        button:hover {
            background: var(--button-hover);
        }

        /* Feedback de presión: instantáneo en pointer-down, no en release */
        button:not(:disabled):active,
        .theme-switcher:active,
        .footer-btn:active,
        .accion-btn:active,
        a.logout-btn:active {
            transform: scale(0.96);
            transition-duration: var(--dur-instant);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        input, select, textarea {
            background: var(--bg-elevated);
            color: var(--text-primary);
            border: 1px solid var(--input-border);
            font-family: inherit;
            transition: border-color var(--dur-fast) var(--ease-standard), box-shadow var(--dur-fast) var(--ease-standard);
        }

        a {
            color: var(--link-color);
            transition: opacity var(--dur-fast) var(--ease-standard), color var(--dur-fast) var(--ease-standard);
        }

        li {
            border-bottom: 1px solid var(--border-color);
        }

        /* Foco visible solo para navegación por teclado: no molesta al usar el ratón/touch */
        :focus {
            outline: none;
        }
        :focus-visible {
            outline: none;
            box-shadow: var(--focus-ring);
            border-radius: var(--radius-sm);
        }

        /* Escala tipográfica óptica: tracking/leading propios por tamaño */
        .type-display {
            letter-spacing: var(--tracking-display);
            line-height: 1.05;
            font-weight: 800;
        }
        .type-title {
            letter-spacing: var(--tracking-title);
            line-height: 1.2;
            font-weight: 700;
        }
        .type-caption {
            letter-spacing: var(--tracking-caption);
            line-height: 1.4;
        }

        /* Importes: cifras de ancho fijo para que no "bailen" al cambiar */
        .tabular-nums {
            font-variant-numeric: tabular-nums;
        }

        /* Materiales translúcidos: blur/saturación por peso de superficie */
        .material-thin {
            background: color-mix(in srgb, var(--bg-elevated) 82%, transparent);
            backdrop-filter: blur(var(--blur-thin)) saturate(160%);
            -webkit-backdrop-filter: blur(var(--blur-thin)) saturate(160%);
        }
        .material-regular {
            background: color-mix(in srgb, var(--bg-elevated) 78%, transparent);
            backdrop-filter: blur(var(--blur-regular)) saturate(180%);
            -webkit-backdrop-filter: blur(var(--blur-regular)) saturate(180%);
        }
        .material-thick {
            background: color-mix(in srgb, var(--bg-elevated) 72%, transparent);
            backdrop-filter: blur(var(--blur-thick)) saturate(180%);
            -webkit-backdrop-filter: blur(var(--blur-thick)) saturate(180%);
        }

        /* Botón de cambio de tema */
        .theme-switcher {
            position: relative;
            margin-left: 0.5rem;
            margin-right: 0.5rem;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--bg-elevated);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            box-shadow: none;
            transition: background-color var(--dur-fast) var(--ease-standard), transform var(--dur-fast) var(--ease-standard);
            z-index: 1000;
        }

        .theme-switcher:hover {
            background: var(--border-color);
            transform: scale(1.05);
        }

        /* Iconos para el botón: cross-fade + rotación sutil, no un salto brusco */
        .theme-switcher .sun-icon,
        .theme-switcher .moon-icon {
            display: block;
            position: absolute;
            width: 18px;
            height: 18px;
            transition: opacity var(--dur-base) var(--ease-standard), transform var(--dur-base) var(--ease-standard);
        }
        .theme-switcher .sun-icon svg,
        .theme-switcher .moon-icon svg {
            width: 100%;
            height: 100%;
            display: block;
        }
        .theme-switcher .sun-icon {
            opacity: 0;
            transform: rotate(-90deg) scale(0.6);
        }
        .theme-switcher .moon-icon {
            opacity: 1;
            transform: rotate(0deg) scale(1);
        }

        [data-theme="dark"] .theme-switcher .sun-icon {
            opacity: 1;
            transform: rotate(0deg) scale(1);
        }

        [data-theme="dark"] .theme-switcher .moon-icon {
            opacity: 0;
            transform: rotate(90deg) scale(0.6);
        }

        /* Estilos responsive */
        @media (max-width: 768px) {
            .container {
                max-width: 95% !important;
                margin: 20px auto !important;
                padding: 1.5rem !important;
            }

            .theme-switcher {
                width: 38px;
                height: 38px;
                font-size: 18px;
                margin-left: 0.2rem;
                margin-right: 0.2rem;
            }

            h1, h2, h3 {
                font-size: 1.5rem !important;
            }

            button {
                padding: 0.8rem 1rem !important;
                font-size: 0.9rem !important;
            }

            input, select {
                padding: 0.8rem !important;
                font-size: 16px !important; /* Evita zoom en iOS */
            }

            .month-nav {
                flex-direction: column !important;
                gap: 0.5rem !important;
            }

            .month-nav .current-month {
                font-size: 1.5rem !important;
            }

            .month-nav a {
                font-size: 0.9rem !important;
                padding: 0.3em 0.5em !important;
            }
        }

        @media (max-width: 480px) {
            .container {
                max-width: 98% !important;
                margin: 10px auto !important;
                padding: 1rem !important;
            }

            .theme-switcher {
                width: 32px;
                height: 32px;
                font-size: 16px;
                margin-left: 0.1rem;
                margin-right: 0.1rem;
            }

            h1, h2, h3 {
                font-size: 1.3rem !important;
            }

            button {
                padding: 0.7rem 0.8rem !important;
                font-size: 0.85rem !important;
            }

            .month-nav .current-month {
                font-size: 1.3rem !important;
            }

            .month-nav a {
                font-size: 0.8rem !important;
                padding: 0.2em 0.4em !important;
            }

            /* Ajustes para formularios en móvil */
            form {
                flex-direction: column !important;
                gap: 0.5rem !important;
            }

            input[type="number"], select {
                width: 100% !important;
            }

            /* Ajustes para listas en móvil */
            li {
                flex-direction: column !important;
                align-items: flex-start !important;
                gap: 0.5rem !important;
                padding: 0.8rem 0 !important;
            }

            li form {
                width: 100% !important;
                margin-top: 0.5rem !important;
            }

            li form button {
                width: 100% !important;
            }
        }

        /* Accesibilidad: movimiento, transparencia y contraste reducidos */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.001ms !important;
                scroll-behavior: auto !important;
            }
            .theme-switcher:active,
            .footer-btn:active,
            .accion-btn:active,
            button:active {
                transform: none !important;
            }
        }

        @media (prefers-reduced-transparency: reduce) {
            .header::before {
                backdrop-filter: none !important;
                -webkit-backdrop-filter: none !important;
                background: var(--bg-secondary) !important;
            }
            .footer-bar {
                backdrop-filter: none !important;
                background: var(--bg-secondary) !important;
            }
            .modal-content {
                backdrop-filter: none !important;
            }
            .material-thin, .material-regular, .material-thick {
                backdrop-filter: none !important;
                background: var(--bg-secondary) !important;
            }
            .landing-nav {
                backdrop-filter: none !important;
                background: var(--bg-secondary) !important;
            }
        }

        @media (prefers-contrast: more) {
            :root {
                --border-color: #7a7a7a;
                --text-secondary: #4a4a4a;
            }
            [data-theme="dark"] {
                --border-color: #8a8a8a;
                --text-secondary: #c8c8c8;
            }
            .container, .balance-card, .movimiento-item, button {
                border-width: 1.5px !important;
            }
        }

        /* Modo secreto: oculta cualquier cifra marcada con .js-money. Primer intento
           (-webkit-text-security con un punto por carácter, acotado a un ancho fijo) se
           cortaba a mitad de un punto en móvil en cuanto el importe real tenía más
           caracteres de los que cabían en ese ancho — un punto literalmente partido por
           la mitad. Esta versión no depende en absoluto de cuántos caracteres tenga el
           número: el texto real se hace transparente (así la caja conserva exactamente el
           ancho que ya sabíamos que cabía, porque es el mismo con el que se pintó el
           importe real) y encima se dibuja un puñado fijo de puntos que nunca cambia de
           tamaño ni se corta, tenga el importe 1 dígito o 6. Funciona igual en cualquier
           navegador, sin prefijos ni fallback aparte. */
        html[data-privacy="on"] .js-money {
            color: transparent !important;
            position: relative;
            display: inline-block;
        }
        html[data-privacy="on"] .js-money::after {
            content: '••••';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-tertiary);
            letter-spacing: 1px;
        }
    </style>

    <!-- Script para aplicar tema y modo secreto inmediatamente y evitar flash -->
    <script th:fragment="theme-script-immediate" th:inline="javascript">
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            const resolvedTheme = savedTheme === 'system'
                ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
                : savedTheme;
            document.documentElement.setAttribute('data-theme', resolvedTheme);
            const savedPrivacy = localStorage.getItem('privacyMode') || 'off';
            document.documentElement.setAttribute('data-privacy', savedPrivacy);
        })();
    </script>
</head>
