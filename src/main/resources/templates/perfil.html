<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Perfil</title>
    <th:block th:replace="~{fragments/pwa-meta :: meta}"></th:block>

    <!-- Estilos globales y de fragmentos -->
    <style th:replace="~{fragments/theme-switcher :: theme-styles}"></style>
    <style th:replace="~{fragments/header :: header-styles}"></style>
    <style th:replace="~{fragments/footer :: footer-styles}"></style>
    <link rel="stylesheet" href="/css/perfil.css">
    <script th:replace="~{fragments/theme-switcher :: theme-script-immediate}"></script>
    <script src="/js/footer-modals.js"></script>
</head>
<body style="display:flex; flex-direction:column; min-height:100vh; margin:0; padding:0;">
    <!-- Header -->
    <div th:replace="~{fragments/header :: header}"></div>
    <div class="main-content">
        <div class="perfil-wrap">
            <h1 class="perfil-titulo">Perfil</h1>

            <div th:if="${error}" class="perfil-message error" th:text="${error}"></div>
            <div th:if="${success}" class="perfil-message success" th:text="${success}"></div>

            <!-- Tarjeta de identidad -->
            <div class="identidad-card">
                <div class="identidad-avatar" th:text="${iniciales}">PA</div>
                <div class="identidad-info">
                    <div class="identidad-nombre" th:text="${user.username}"></div>
                    <div class="identidad-email" th:text="${user.email}"></div>
                </div>
                <button type="button" class="identidad-editar-btn" id="btnEditarIdentidad" title="Editar perfil">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
            </div>

            <!-- Sección cuenta -->
            <div class="cuenta-section">
                <div class="cuenta-section-label">Cuenta</div>
                <div class="cuenta-options">
                    <a href="/estadisticas" class="cuenta-option">
                        <span class="cuenta-option-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12A9 9 0 1 1 12 3" stroke-linecap="round"/><path d="M21 12A9 9 0 0 0 12 3v9z" stroke-linejoin="round"/></svg>
                        </span>
                        <span class="cuenta-option-label">Estadísticas</span>
                        <svg class="cuenta-option-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </a>
                    <button type="button" class="cuenta-option" id="btnCambiarPasswordPerfil">
                        <span class="cuenta-option-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4" stroke-linecap="round"/></svg>
                        </span>
                        <span class="cuenta-option-label">Cambiar contraseña</span>
                        <svg class="cuenta-option-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </button>
                    <a href="/ajustes" class="cuenta-option">
                        <span class="cuenta-option-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        </span>
                        <span class="cuenta-option-label">Ajustes</span>
                        <svg class="cuenta-option-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </a>
                </div>
            </div>

            <!-- Sección seguridad: passkeys -->
            <div class="cuenta-section passkeys-section">
                <div class="cuenta-section-label">Passkeys</div>
                <div class="cuenta-options">
                    <div class="passkey-item" th:each="pk : ${passkeys}">
                        <span class="cuenta-option-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="4"/><path d="M2 20c0-3.5 3-6 7-6 1.2 0 2.3.2 3.3.7" stroke-linecap="round"/><circle cx="18" cy="13" r="2.5"/><path d="M18 15.5V21M18 18.5h2" stroke-linecap="round"/></svg>
                        </span>
                        <span class="passkey-item-info">
                            <span class="passkey-item-nombre" th:text="${pk.nombre}">iPhone</span>
                            <span class="passkey-item-fecha"
                                  th:text="${pk.lastUsedAt != null} ? 'Último uso: ' + ${#temporals.format(pk.lastUsedAt, 'dd/MM/yyyy')} : 'Creada: ' + ${#temporals.format(pk.createdAt, 'dd/MM/yyyy')}">Creada: 01/01/2026</span>
                        </span>
                        <form th:action="@{/perfil/passkeys/{id}/eliminar(id=${pk.id})}" method="post" class="passkey-eliminar-form">
                            <button type="submit" class="passkey-eliminar-btn" title="Eliminar passkey" aria-label="Eliminar passkey">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                            </button>
                        </form>
                    </div>
                    <button type="button" class="cuenta-option" id="btnAnadirPasskey">
                        <span class="cuenta-option-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>
                        </span>
                        <span class="cuenta-option-label">Añadir passkey</span>
                    </button>
                </div>
                <p class="passkeys-ayuda" id="passkeysAyuda">Inicia sesión con Face ID, Touch ID o el PIN de tu dispositivo, sin contraseña.</p>
            </div>
        </div>
    </div>

    <!-- Modal: editar nombre y correo -->
    <div id="modalEditarIdentidad" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">Editar perfil</h3>
                <button type="button" class="modal-close" id="closeEditarIdentidad" aria-label="Cerrar">&times;</button>
            </div>
            <form id="formEditarIdentidad" class="modal-form" th:action="@{/perfil/actualizar-identidad}" method="post">
                <div class="form-group">
                    <label for="identidadNombre">Nombre de usuario</label>
                    <input type="text" id="identidadNombre" name="nombre" th:value="${user.username}" required>
                </div>
                <div class="form-group">
                    <label for="identidadEmail">Correo electrónico</label>
                    <input type="email" id="identidadEmail" name="email" th:value="${user.email}" required>
                </div>
                <div class="form-group">
                    <label for="identidadPassword">Contraseña actual</label>
                    <input type="password" id="identidadPassword" name="passwordActual" placeholder="Necesaria para confirmar los cambios" required>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" id="cancelarEditarIdentidad">Cancelar</button>
                    <button type="submit" class="btn-save">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: cambiar contraseña -->
    <div id="modalCambiarPassword" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">Cambiar contraseña</h3>
                <button type="button" class="modal-close" id="closeCambiarPassword" aria-label="Cerrar">&times;</button>
            </div>
            <form id="formCambiarPassword" class="modal-form" th:action="@{/perfil/cambiar-password}" method="post">
                <div class="form-group">
                    <label for="passwordActualPerfil">Contraseña actual</label>
                    <input type="password" id="passwordActualPerfil" name="passwordActual" required>
                </div>
                <div class="form-group">
                    <label for="passwordNuevaPerfil">Nueva contraseña</label>
                    <input type="password" id="passwordNuevaPerfil" name="nuevoPassword" minlength="8" required>
                </div>
                <div class="form-group">
                    <label for="passwordRepetirPerfil">Repetir nueva contraseña</label>
                    <input type="password" id="passwordRepetirPerfil" minlength="8" required>
                </div>
                <p id="passwordMismatchError" class="perfil-message error" style="display:none;">Las contraseñas nuevas no coinciden.</p>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" id="cancelarCambiarPassword">Cancelar</button>
                    <button type="submit" class="btn-save">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: añadir passkey -->
    <div id="modalAnadirPasskey" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">Añadir passkey</h3>
                <button type="button" class="modal-close" id="closeAnadirPasskey" aria-label="Cerrar">&times;</button>
            </div>
            <form id="formAnadirPasskey" class="modal-form">
                <div class="form-group">
                    <label for="passkeyNombre">Nombre del dispositivo</label>
                    <input type="text" id="passkeyNombre" maxlength="100" required>
                </div>
                <p id="passkeyError" class="perfil-message error" hidden></p>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" id="cancelarAnadirPasskey">Cancelar</button>
                    <button type="submit" class="btn-save" id="btnConfirmarPasskey">Continuar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <!-- Scripts de header y tema -->
    <script th:replace="~{fragments/header :: header-script}"></script>
    <script th:replace="~{fragments/theme-switcher :: theme-script}"></script>
    <script src="/js/passkey.js"></script>
    <script src="/js/perfil.js"></script>
</body>
</html>
